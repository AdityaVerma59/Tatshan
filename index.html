<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tatshan · तत्क्षण — instant file transfer</title>
  <meta name="description" content="Send files instantly with a QR code. No phone numbers, no links, no sign-up. Made for print shops too.">
  <meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" href="fonts/tiro-devanagari.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/tiro-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="demo-banner" class="demo-banner" hidden>
    Demo mode: files only travel between tabs of this browser. Add your Firebase keys in <code>js/config.js</code> to go live.
  </div>

  <header class="top wrap">
    <a class="logo" href="#/" aria-label="Tatshan home">
      <span class="logo-hi" lang="hi">तत्क्षण</span>
      <span class="logo-en">Tatshan</span>
    </a>
    <a class="top-link" href="#/shop">For print shops</a>
  </header>

  <main id="app" class="wrap" tabindex="-1">
    <div class="center pad"><span class="spinner" role="status" aria-label="Loading"></span></div>
  </main>

  <footer class="foot wrap">
    <p>Files are deleted the moment they’re downloaded, or after 6 hours.</p>
  </footer>

  <noscript><p class="wrap">Tatshan needs JavaScript to run.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
